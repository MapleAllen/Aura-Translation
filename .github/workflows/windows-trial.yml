name: Windows Trial Gate

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run live DeepSeek and Ollama provider smoke checks
        required: false
        default: false
        type: boolean

jobs:
  windows-trial:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Rust tests
        run: cargo test --manifest-path .\src-tauri\Cargo.toml

      - name: UI tests
        run: npm test

      - name: Build release bundles
        run: npm run tauri build

      - name: Live provider smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_smoke }}
        env:
          AURA_SMOKE_DEEPSEEK_API_KEY: ${{ secrets.AURA_SMOKE_DEEPSEEK_API_KEY }}
          AURA_SMOKE_OLLAMA_BASE_URL: ${{ secrets.AURA_SMOKE_OLLAMA_BASE_URL }}
          AURA_SMOKE_OLLAMA_MODEL: ${{ secrets.AURA_SMOKE_OLLAMA_MODEL }}
        run: npm run release:smoke-providers

      - name: Install acceptance
        run: powershell -ExecutionPolicy Bypass -File scripts/release/accept-install.ps1 -SkipBuild

      - name: Resource measurement
        run: npm run release:measure-resources

      - name: Upload Windows trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-artifacts
          path: |
            artifacts/windows-trial/**
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
