name: macOS Adaptation Gate

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:

jobs:
  macos-adaptation:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: UI tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml

      - name: Build macOS bundle
        run: npm run tauri build
